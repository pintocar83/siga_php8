[opcache]
opcache.enable=0

[PHP]
;; Ocultar avisos de tipo Deprecated y Notice, manteniendo el reporte de errores críticos
error_reporting = E_ALL & ~E_DEPRECATED & ~E_USER_DEPRECATED & ~E_NOTICE & ~E_USER_NOTICE

;; Evitar que los errores se impriman directamente en la pantalla del navegador (ideal para producción o reportes PDF)
display_errors = Off

;; Asegurar que los errores se registren en los logs del contenedor si necesitas depurar después
log_errors = On
